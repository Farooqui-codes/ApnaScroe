<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#208B4E" />
  <title>Tournaments – ApnaScore</title>
  <meta name="description" content="Organize village leagues, knockouts, round-robin & group-stage cricket tournaments with auto fixtures, live NRR points tables & Results PDF." />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="ApnaScore" />
  <meta property="og:title" content="Tournaments – ApnaScore" />
  <meta property="og:description" content="Create tournaments, manage teams, generate fixtures, and track Points Table & NRR separately from simple matches." />
  <meta property="og:image" content="/assets/images/apnascore-og-preview.jpg" />
  <meta property="og:url" content="/tournament.html" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32.png" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/responsive.css" />
  <link rel="stylesheet" href="/css/dashboard.css" />
  <link rel="stylesheet" href="/css/tournament.css" />
  <link rel="stylesheet" href="/css/animations.css" />
</head>
<body>
  <div id="appShell">
    <div class="main-content-slot">
      <!-- Tournament List View -->
      <section id="tournamentListView">
        <div class="card mb-2">
          <div class="flex-between">
            <div>
              <h1 class="card-title" style="font-size:1.25rem;">Tournaments</h1>
              <span class="text-sm text-muted">Create your tournament, add teams, and manage matches</span>
            </div>
            <button type="button" class="btn btn-primary" id="openCreateTourBtn">+ Create Tournament</button>
          </div>

          <div class="tabs-bar mt-2" id="tourListTabs">
            <button type="button" class="tab-btn active" data-tfilter="mine">My Tournaments</button>
            <button type="button" class="tab-btn" data-tfilter="upcoming">Upcoming</button>
            <button type="button" class="tab-btn" data-tfilter="ongoing">Live</button>
            <button type="button" class="tab-btn" data-tfilter="completed">Completed</button>
          </div>

          <input class="form-control" id="tourSearchInput" placeholder="Search tournament by name or village..." />
        </div>
        <div id="tournamentsGrid" class="entity-grid">
          <div class="empty-state">Loading tournaments...</div>
        </div>
      </section>

      <!-- Tournament Detail View -->
      <section id="tournamentDetailView" class="hidden">
        <div class="card mb-2">
          <div class="flex-between">
            <div class="flex-gap">
              <a href="/tournament.html" class="btn btn-secondary btn-sm">← All Tournaments</a>
              <h2 class="card-title" id="tdTitle">Tournament</h2>
            </div>
            <div class="flex-gap">
              <span class="badge badge-neutral" id="tdPlanBadge">FREE</span>
              <button type="button" class="btn btn-lime btn-sm hidden" id="tdUpgradeProBtn">Upgrade to Pro</button>
              <a id="tdShareBtn" target="_blank" class="btn btn-secondary btn-sm">Public Page</a>
              <a id="tdPdfBtn" target="_blank" class="btn btn-secondary btn-sm">Basic PDF</a>
              <button type="button" class="btn btn-primary btn-sm" id="tdProPdfBtn">Pro PDF</button>
            </div>
          </div>
          <p class="text-sm text-muted mt-1" id="tdMeta"></p>
        </div>

        <div class="tabs-bar" id="tourDetailTabs">
          <button type="button" class="tab-btn active" data-ttab="overview">Overview</button>
          <button type="button" class="tab-btn" data-ttab="teams">Teams</button>
          <button type="button" class="tab-btn" data-ttab="fees">Entry Fees (Pro)</button>
          <button type="button" class="tab-btn" data-ttab="fixtures">Fixtures</button>
          <button type="button" class="tab-btn" data-ttab="points">Points Table</button>
          <button type="button" class="tab-btn" data-ttab="live">Live Matches</button>
          <button type="button" class="tab-btn" data-ttab="results">Results</button>
          <button type="button" class="tab-btn" data-ttab="settings">Tournament Settings</button>
        </div>

        <div id="tPanel-overview" class="card"></div>
        <div id="tPanel-teams" class="card hidden"></div>
        <div id="tPanel-fees" class="card hidden"></div>
        <div id="tPanel-fixtures" class="card hidden"></div>
        <div id="tPanel-points" class="card hidden"></div>
        <div id="tPanel-live" class="card hidden"></div>
        <div id="tPanel-results" class="card hidden"></div>
        <div id="tPanel-settings" class="card hidden"></div>
      </section>
    </div>
  </div>

  <!-- Create Tournament 3-Step Wizard Modal -->
  <div class="modal-backdrop" id="createTourModal">
    <div class="modal-dialog" style="max-width:600px;">
      <div class="modal-header">
        <h3 class="modal-title">Create Tournament</h3>
        <button type="button" class="icon-btn" onclick="document.getElementById('createTourModal').classList.remove('open')">✕</button>
      </div>

      <div class="wizard-steps mb-2" id="tourWizSteps">
        <button type="button" class="wizard-step-pill active" data-tw="1">1. Info</button>
        <button type="button" class="wizard-step-pill" data-tw="2">2. Format</button>
        <button type="button" class="wizard-step-pill" data-tw="3">3. Rules & Registration</button>
      </div>

      <form id="createTourForm" novalidate>
        <div class="tw-panel" data-twp="1">
          <div class="form-group"><label class="form-label">Tournament Name</label><input class="form-control" id="ctName" required placeholder="e.g. Rampur Cricket Cup" /></div>
          <div class="form-grid-2">
            <div class="form-group"><label class="form-label">Location / Village</label><input class="form-control" id="ctVillage" required placeholder="e.g. Rampur" /></div>
            <div class="form-group"><label class="form-label">Start Date</label><input class="form-control" id="ctStart" type="date" required /></div>
          </div>
          <div class="flex-between mt-2">
            <span></span>
            <button type="button" class="btn btn-primary" onclick="TourWiz.go(2)">Next: Format →</button>
          </div>
        </div>

        <div class="tw-panel hidden" data-twp="2">
          <div class="form-grid-3">
            <div class="form-group"><label class="form-label">Number of Teams (Free: max 4)</label><input class="form-control" id="ctMaxTeams" type="number" min="2" max="64" value="4" /></div>
            <div class="form-group"><label class="form-label">Overs per Match</label><input class="form-control" id="ctOvers" type="number" min="1" max="50" value="8" /></div>
            <div class="form-group"><label class="form-label">Tournament Format</label>
              <select class="form-control" id="ctFormat">
                <option value="knockout">Knockout</option>
                <option value="league">League</option>
                <option value="round_robin">Round Robin</option>
                <option value="group_stage">Group Stage</option>
                <option value="league_knockout">League + Knockout</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">End Date</label>
            <input class="form-control" id="ctEnd" type="date" required />
          </div>
          <div class="flex-between mt-2">
            <button type="button" class="btn btn-secondary" onclick="TourWiz.go(1)">← Back</button>
            <button type="button" class="btn btn-primary" onclick="TourWiz.go(3)">Next: Rules →</button>
          </div>
        </div>

        <div class="tw-panel hidden" data-twp="3">
          <div class="form-grid-2">
            <div class="form-group"><label class="form-label">Entry Fee (₹)</label><input class="form-control" id="ctFee" type="number" min="0" value="0" /></div>
            <div class="form-group"><label class="form-label">Prize Money / Trophy</label><input class="form-control" id="ctPrize" placeholder="Optional" /></div>
            <div class="form-group"><label class="form-label">Scoring Rule Preset</label>
              <select class="form-control" id="ctRulePreset">
                <option value="village_6_over">6/8-Over Village Rules</option>
                <option value="standard_cricket">Standard Cricket</option>
                <option value="tennis_ball">Tennis Ball Cricket</option>
                <option value="gully_cricket">Gully Cricket</option>
              </select>
            </div>
            <div class="form-group"><label class="form-label">Tie-Breaker</label>
              <select class="form-control" id="ctTieBreaker">
                <option value="nrr">Net Run Rate (NRR)</option>
                <option value="wins">Total Wins</option>
                <option value="head_to_head">Head to Head</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">Add Existing Teams (Optional)</label>
            <select class="form-control" id="ctTeamsMulti" multiple style="min-height:80px;"></select>
          </div>
          <div class="switch-row mb-2">
            <label for="ctPublic">Publicly Visible Tournament</label>
            <input type="checkbox" class="toggle-check" id="ctPublic" checked />
          </div>
          <div class="flex-between mt-2">
            <button type="button" class="btn btn-secondary" onclick="TourWiz.go(2)">← Back</button>
            <button type="submit" class="btn btn-primary btn-lg">Create Tournament</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <!-- Edit Fixture Modal (Pro) -->
  <div class="modal-backdrop" id="editFixtureModal">
    <div class="modal-dialog">
      <div class="modal-header">
        <h3 class="modal-title">Edit Fixture Schedule</h3>
        <button type="button" class="icon-btn" onclick="document.getElementById('editFixtureModal').classList.remove('open')">✕</button>
      </div>
      <div class="form-group"><label class="form-label">Round Name</label><input class="form-control" id="efRound" /></div>
      <div class="form-grid-2">
        <div class="form-group"><label class="form-label">Match Date</label><input class="form-control" id="efDate" type="date" /></div>
        <div class="form-group"><label class="form-label">Match Time</label><input class="form-control" id="efTime" placeholder="e.g. 09:30 AM" /></div>
      </div>
      <div class="form-group"><label class="form-label">Ground / Venue</label><input class="form-control" id="efVenue" /></div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" onclick="document.getElementById('editFixtureModal').classList.remove('open')">Cancel</button>
        <button type="button" class="btn btn-primary" id="saveFixtureEditBtn">Save Fixture</button>
      </div>
    </div>
  </div>

  <script src="/js/icons.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/scoring-engine.js"></script>
  <script src="/js/offline-sync.js"></script>
  <script src="/js/migrate.js"></script>
  <script src="/js/pro-upgrade.js"></script>
  <script src="/js/vendor/gsap.min.js" defer></script>
  <script src="/js/vendor/ScrollTrigger.min.js" defer></script>
  <script src="/js/vendor/lenis.min.js" defer></script>
  <script src="/js/animations.js" defer></script>
  <script src="/js/main.js"></script>
  <script src="/js/tournament.js"></script>
</body>
</html>
