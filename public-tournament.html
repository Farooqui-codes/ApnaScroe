<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#208B4E" />
  <title>Tournament Hub – ApnaScore</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32.png" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/responsive.css" />
  <link rel="stylesheet" href="/css/tournament.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-left">
      <img src="/assets/logos/apnascore-logo.png" alt="ApnaScore" style="width:40px;height:40px;object-fit:contain;border-radius:8px;" />
      <div>
        <div class="topbar-page-title" id="ptTitle">ApnaScore Tournament</div>
        <div class="text-sm text-muted" id="ptSub">Public Tournament Hub</div>
      </div>
    </div>
    <div class="topbar-actions">
      <a href="/dashboard.html" class="btn btn-primary btn-sm">Open App</a>
    </div>
  </header>

  <main class="page-content" style="max-width:1024px;margin:0 auto;">
    <div class="card mb-2" id="ptPointsCard"></div>
    <div class="card" id="ptFixturesCard"></div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/main.js"></script>
  <script>
    ApnaUI.applyTheme(localStorage.getItem('apnascore_theme') || 'light');
    const id = new URLSearchParams(window.location.search).get('id');
    (async function () {
      if (!id) return;
      try {
        const data = await ApnaAPI.get(`/api/public/tournaments/${encodeURIComponent(id)}`);
        const t = data.tournament;
        document.getElementById('ptTitle').textContent = t.name;
        document.getElementById('ptSub').textContent = `${t.village} • ${t.oversPerMatch} Overs • ${t.status.toUpperCase()}`;

        const rows = data.pointsTable || [];
        document.getElementById('ptPointsCard').innerHTML = `
          <div class="card-header"><h3 class="card-title">Points Table</h3></div>
          <div class="table-wrap"><table class="data-table">
            <thead><tr><th>#</th><th>Team</th><th class="num">P</th><th class="num">W</th><th class="num">L</th><th class="num">Pts</th><th class="num">NRR</th></tr></thead>
            <tbody>${rows.map((r, i) => `<tr><td>${i + 1}</td><td><strong>${ApnaUI.escapeHtml(r.teamName)}</strong></td><td class="num">${r.played}</td><td class="num">${r.won}</td><td class="num">${r.lost}</td><td class="num"><strong>${r.points}</strong></td><td class="num">${Number(r.netRunRate || 0).toFixed(3)}</td></tr>`).join('') || '<tr><td colspan="7">No standings yet</td></tr>'}</tbody>
          </table></div>`;

        const fx = data.fixtures || [];
        document.getElementById('ptFixturesCard').innerHTML = `
          <div class="card-header"><h3 class="card-title">Fixtures</h3></div>
          ${fx.map((f) => `<div class="fixture-card"><div><strong>${ApnaUI.escapeHtml(f.teamAName)} vs ${ApnaUI.escapeHtml(f.teamBName)}</strong><div class="text-sm text-muted">${ApnaUI.escapeHtml(f.roundName)} • ${ApnaUI.escapeHtml(f.resultText || f.status)}</div></div>${f.matchId ? `<a href="/public-match.html?id=${f.matchId}" class="btn btn-secondary btn-sm">Live</a>` : ''}</div>`).join('') || '<div class="empty-state">No fixtures yet.</div>'}`;
      } catch (err) {
        document.getElementById('ptPointsCard').innerHTML = `<div class="empty-state">${ApnaUI.escapeHtml(err.message)}</div>`;
      }
    }());
  </script>
</body>
</html>
