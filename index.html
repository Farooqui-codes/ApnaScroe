<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#208B4E" />
  <title>ApnaScore – Apne Gaon ka Apna Scorer</title>
  <meta name="description" content="Score village, gully & tennis-ball cricket live — even 100% offline! Custom local rules, instant ball-by-ball scorecards, tournament points tables & NRR, player stats, and pro PDF exports. Start scoring free without sign-up!" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="ApnaScore" />
  <meta property="og:title" content="ApnaScore – Apne Gaon ka Apna Scorer | Live Cricket Scoring & Tournaments" />
  <meta property="og:description" content="Score village, gully & tennis-ball cricket live — even 100% offline! Custom local rules, instant ball-by-ball scorecards, tournament points tables & NRR, player stats, and pro PDF exports. Start scoring free without sign-up!" />
  <meta property="og:image" content="/assets/images/apnascore-og-preview.jpg" />
  <meta property="og:image:type" content="image/jpeg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="ApnaScore – Apne Gaon ka Apna Scorer" />
  <meta property="og:url" content="/" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="ApnaScore – Apne Gaon ka Apna Scorer | Live Cricket Scoring & Tournaments" />
  <meta name="twitter:description" content="Score village, gully & tennis-ball cricket live — even 100% offline! Custom local rules, instant ball-by-ball scorecards, tournament points tables & NRR, player stats, and pro PDF exports. Start scoring free without sign-up!" />
  <meta name="twitter:image" content="/assets/images/apnascore-og-preview.jpg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32.png" />
  <link rel="apple-touch-icon" href="/assets/icons/icon-192.png" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/responsive.css" />
  <link rel="stylesheet" href="/css/animations.css" />
  <style>
    .splash-wrap {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      text-align: center;
    }
    .splash-card {
      max-width: 540px;
      width: 100%;
      background: var(--bg-surface);
      border: 2px solid var(--border-color);
      border-radius: 22px;
      padding: 28px 22px;
      box-shadow: var(--shadow-lg);
    }
    .splash-logo {
      width: 180px;
      height: 180px;
      object-fit: contain;
      margin: 0 auto 14px;
      border-radius: 18px;
    }
    .feature-pills {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin: 16px 0 22px;
    }
    .splash-actions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }
    @media (max-width: 480px) {
      .splash-actions { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="splash-wrap">
    <div class="splash-card">
      <img src="/assets/logos/apnascore-logo.png" alt="ApnaScore Logo" class="splash-logo" />
      <h1 style="margin:0;font-size:1.75rem;font-weight:900;color:var(--text-primary);">ApnaScore</h1>
      <p style="margin:4px 0 2px;font-weight:700;color:var(--text-brand);">Apne Gaon ka Apna Scorer</p>
      <p class="text-muted text-sm" style="margin:0;">Har Gaon Ka Apna Cricket Scoreboard.</p>

      <div class="feature-pills">
        <span class="badge badge-success">Offline Ball-by-Ball Scoring</span>
        <span class="badge badge-success">Custom Village Rules</span>
        <span class="badge badge-success">Tournaments & NRR</span>
        <span class="badge badge-success">PDF Scorecards</span>
      </div>

      <button type="button" id="continueGuestBtn" class="btn btn-primary btn-lg" style="width:100%;margin-bottom:10px;">Continue as Guest (Start Scoring Instantly)</button>

      <div class="splash-actions">
        <a href="/dashboard.html" class="btn btn-secondary">Open Dashboard</a>
        <a href="/live-score.html" class="btn btn-secondary">Live Matches</a>
        <a href="/login.html" class="btn btn-secondary">Scorer Login</a>
        <a href="/register.html" class="btn btn-lime">Create Account</a>
      </div>
    </div>
  </main>
  <script src="/js/icons.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/offline-sync.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/main.js"></script>
  <script>
    ApnaUI.applyTheme(localStorage.getItem('apnascore_theme') || 'light');
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('/service-worker.js').catch(() => {});
    document.getElementById('continueGuestBtn').addEventListener('click', async (e) => {
      e.target.disabled = true;
      e.target.textContent = 'Opening Guest Mode...';
      await ApnaAuth.continueAsGuest('/dashboard.html');
    });
  </script>
</body>
</html>
