<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#208B4E" />
  <title>Login – ApnaScore</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32.png" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/responsive.css" />
  <style>
    .auth-shell {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 14px;
    }
    .auth-card {
      width: 100%;
      max-width: 430px;
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 18px;
      padding: 26px 22px;
      box-shadow: var(--shadow-lg);
    }
    .auth-brand {
      text-align: center;
      margin-bottom: 18px;
    }
    .auth-brand img {
      width: 110px;
      height: 110px;
      object-fit: contain;
      margin: 0 auto 8px;
      border-radius: 14px;
    }
  </style>
</head>
<body>
  <main class="auth-shell">
    <div class="auth-card">
      <div class="auth-brand">
        <img src="/assets/logos/apnascore-logo.png" alt="ApnaScore" />
        <h1 style="margin:0;font-size:1.35rem;font-weight:800;">Sign in to ApnaScore</h1>
        <p class="text-muted text-sm" style="margin:4px 0 0;">Apne Gaon ka Apna Scorer</p>
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label class="form-label" for="loginEmail">Email Address</label>
          <input class="form-control" id="loginEmail" type="email" required placeholder="scorer@villagecricket.in" autocomplete="email" />
        </div>
        <div class="form-group">
          <label class="form-label" for="loginPassword">Password</label>
          <input class="form-control" id="loginPassword" type="password" required placeholder="Enter your password" autocomplete="current-password" />
        </div>
        <div id="loginError" class="text-sm hidden" style="color:var(--danger);font-weight:600;margin-bottom:10px;"></div>
        <button type="submit" class="btn btn-primary btn-lg" style="width:100%;" id="loginSubmitBtn">Login</button>
      </form>

      <div class="flex-between mt-2 text-sm">
        <a href="/register.html">New user? Create account</a>
        <a href="/dashboard.html">Explore Dashboard</a>
      </div>
    </div>
  </main>

  <script src="/js/icons.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/main.js"></script>
  <script>
    ApnaUI.applyTheme(localStorage.getItem('apnascore_theme') || 'light');
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errEl = document.getElementById('loginError');
      const btn = document.getElementById('loginSubmitBtn');
      errEl.classList.add('hidden');
      btn.disabled = true;
      btn.textContent = 'Signing in...';
      try {
        const res = await ApnaAPI.post('/api/auth/login', {
          email: document.getElementById('loginEmail').value.trim(),
          password: document.getElementById('loginPassword').value
        });
        ApnaAPI.setSession(res.token, res.user);
        const params = new URLSearchParams(window.location.search);
        const nextUrl = params.get('next');
        window.location.href = nextUrl && nextUrl.startsWith('/') ? nextUrl : '/dashboard.html';
      } catch (err) {
        errEl.textContent = err.message;
        errEl.classList.remove('hidden');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Login';
      }
    });
  </script>
</body>
</html>
