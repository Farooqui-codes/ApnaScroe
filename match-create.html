<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#208B4E" />
  <title>Simple Match – ApnaScore</title>
  <meta name="description" content="Create a simple cricket match in 4 quick steps — Team names, overs, optional players, and toss — and start scoring immediately on ApnaScore." />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="ApnaScore" />
  <meta property="og:title" content="Simple Match – ApnaScore" />
  <meta property="og:description" content="Create a simple cricket match in 4 quick steps and start scoring immediately." />
  <meta property="og:image" content="/assets/images/apnascore-og-preview.jpg" />
  <meta property="og:url" content="/match-create.html" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32.png" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="stylesheet" href="/css/fontawesome.min.css" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/fontawesome.min.css?v=15" />
  <link rel="stylesheet" href="/css/style.css?v=15" />
  <link rel="stylesheet" href="/css/responsive.css?v=15" />
  <link rel="stylesheet" href="/css/dashboard.css?v=15" />
  <link rel="stylesheet" href="/css/animations.css?v=15" />
  <style>
    /* Direct High-Specificity Scorer UI Styles (Photo 1 Matching) */
    body {
      background-color: #EEF3F0 !important;
    }
    .cs-container {
      max-width: 620px !important;
      margin: 0 auto !important;
      padding: 14px 16px 110px !important;
    }
    .cs-section {
      margin-bottom: 20px !important;
    }
    .cs-section-label {
      display: flex !important;
      align-items: center !important;
      justify-content: space-between !important;
      font-size: 1.15rem !important;
      font-weight: 700 !important;
      color: #208B4E !important;
      margin-bottom: 8px !important;
    }
    .cs-card {
      background: #FFFFFF !important;
      border: 1px solid #E2E8F0 !important;
      border-radius: 12px !important;
      padding: 16px 20px !important;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05) !important;
    }
    .cs-underline-input {
      width: 100% !important;
      border: none !important;
      border-bottom: 1.5px solid #CBD5E1 !important;
      background: transparent !important;
      padding: 10px 4px !important;
      font-size: 1.1rem !important;
      font-weight: 500 !important;
      color: #1E293B !important;
      border-radius: 0 !important;
      outline: none !important;
      transition: border-color 0.2s ease !important;
      box-sizing: border-box !important;
    }
    .cs-underline-input:focus {
      border-bottom-color: #208B4E !important;
    }
    .cs-underline-input::placeholder {
      color: #94A3B8 !important;
      font-weight: 400 !important;
    }
    .cs-radio-group {
      display: flex !important;
      align-items: center !important;
      gap: 32px !important;
      flex-wrap: wrap !important;
    }
    .cs-radio-item {
      display: inline-flex !important;
      align-items: center !important;
      gap: 10px !important;
      cursor: pointer !important;
      font-size: 1.05rem !important;
      font-weight: 600 !important;
      color: #1E293B !important;
      user-select: none !important;
    }
    .cs-radio-item input[type="radio"] {
      width: 20px !important;
      height: 20px !important;
      accent-color: #208B4E !important;
      cursor: pointer !important;
      margin: 0 !important;
    }
    .cs-toss-btn {
      display: inline-flex !important;
      align-items: center !important;
      gap: 8px !important;
      background: #E2F1E6 !important;
      border: 1.5px solid #9ADE68 !important;
      color: #0F3822 !important;
      font-size: 0.88rem !important;
      font-weight: 700 !important;
      padding: 6px 14px !important;
      border-radius: 20px !important;
      cursor: pointer !important;
      transition: all 0.15s ease !important;
    }
    .cs-toss-btn:hover {
      background: #9ADE68 !important;
      transform: translateY(-1px) !important;
    }
    .cs-actions-row {
      display: flex !important;
      align-items: center !important;
      justify-content: space-between !important;
      gap: 16px !important;
      margin-top: 28px !important;
    }
    .cs-btn-advanced {
      background: none !important;
      border: none !important;
      color: #1E293B !important;
      font-size: 1.08rem !important;
      font-weight: 600 !important;
      cursor: pointer !important;
      padding: 8px 0 !important;
      text-decoration: underline !important;
      text-underline-offset: 4px !important;
      text-decoration-color: transparent !important;
      transition: all 0.2s ease !important;
    }
    .cs-btn-advanced:hover {
      color: #208B4E !important;
      text-decoration-color: #208B4E !important;
    }
    .cs-btn-start {
      background: #208B4E !important;
      color: #FFFFFF !important;
      border: none !important;
      border-radius: 10px !important;
      padding: 13px 34px !important;
      font-size: 1.12rem !important;
      font-weight: 700 !important;
      cursor: pointer !important;
      box-shadow: 0 4px 12px rgba(32, 139, 78, 0.3) !important;
      transition: all 0.15s ease !important;
      display: inline-flex !important;
      align-items: center !important;
      justify-content: center !important;
      min-width: 150px !important;
    }
    .cs-btn-start:hover {
      background: #1b7340 !important;
      transform: translateY(-1px) !important;
      box-shadow: 0 6px 16px rgba(32, 139, 78, 0.38) !important;
    }
    .cs-btn-start:active {
      transform: translateY(0) !important;
    }
    [data-theme="dark"] body {
      background-color: #0F172A !important;
    }
    [data-theme="dark"] .cs-card {
      background: #1E293B !important;
      border-color: #334155 !important;
    }
    [data-theme="dark"] .cs-underline-input {
      color: #F8FAFC !important;
      border-bottom-color: #475569 !important;
    }
    [data-theme="dark"] .cs-radio-item {
      color: #F8FAFC !important;
    }
    [data-theme="dark"] .cs-btn-advanced {
      color: #CBD5E1 !important;
    }
  </style>
</head>
<body>
  <div id="appShell">
    <div class="main-content-slot">
      <div class="cs-container">
        <div id="tournamentMatchNotice" class="badge badge-success mb-2 hidden">Tournament Fixture Match</div>

        <form id="matchWizardForm" novalidate>
          <datalist id="existingTeamsDatalist"></datalist>

          <!-- 1. TEAMS (PHOTO 1) -->
          <div class="cs-section">
            <span class="cs-section-label">Teams</span>
            <div class="cs-card">
              <input type="text" class="cs-underline-input" id="teamANameInput" list="existingTeamsDatalist" required placeholder="Host Team" autocomplete="off" />
              <div style="height: 18px;"></div>
              <input type="text" class="cs-underline-input" id="teamBNameInput" list="existingTeamsDatalist" required placeholder="Visitor Team" autocomplete="off" />
            </div>
          </div>

          <!-- 2. TOSS WON BY? (PHOTO 1) WITH COIN TOSS BUTTON -->
          <div class="cs-section">
            <div class="cs-section-label">
              <span>Toss won by?</span>
              <button type="button" class="cs-toss-btn" id="btnFlipSikkaQuick" title="Flip Coin Toss">
                <i class="fa-solid fa-coins"></i> Flip Sikka (Coin Toss)
              </button>
            </div>
            <div class="cs-card">
              <div class="cs-radio-group">
                <label class="cs-radio-item" id="tossChoiceALabelWrap">
                  <input type="radio" name="tossSideRadio" value="A" id="tossSideARadio" checked />
                  <span id="tossWinnerALabel">Host Team</span>
                </label>
                <label class="cs-radio-item" id="tossChoiceBLabelWrap">
                  <input type="radio" name="tossSideRadio" value="B" id="tossSideBRadio" />
                  <span id="tossWinnerBLabel">Visitor Team</span>
                </label>
              </div>
            </div>
          </div>

          <!-- 3. OPTED TO? (PHOTO 1) -->
          <div class="cs-section">
            <span class="cs-section-label">Opted to?</span>
            <div class="cs-card">
              <div class="cs-radio-group">
                <label class="cs-radio-item">
                  <input type="radio" name="tossDecRadio" value="bat" id="tossDecBatRadio" checked />
                  <span>Bat</span>
                </label>
                <label class="cs-radio-item">
                  <input type="radio" name="tossDecRadio" value="bowl" id="tossDecBowlRadio" />
                  <span>Bowl</span>
                </label>
              </div>
            </div>
          </div>

          <!-- 4. OVERS? (PHOTO 1) -->
          <div class="cs-section">
            <span class="cs-section-label">Overs?</span>
            <div class="cs-card">
              <input class="cs-underline-input" id="customOversInput" type="number" min="1" max="100" value="16" placeholder="16" required />
            </div>
          </div>

          <!-- ADVANCED SETTINGS (COLLAPSIBLE) -->
          <div class="cs-section hidden" id="advancedMatchPanel">
            <div class="cs-card" style="margin-bottom:12px;">
              <div class="flex-between mb-2">
                <h3 style="margin:0;font-size:1.05rem;color:var(--text-primary);">Advanced Ground & Rules</h3>
                <button type="button" class="cs-toss-btn" id="btnFlipSikkaModal"><i class="fa-solid fa-coins"></i> Flip Sikka (Coin Toss)</button>
              </div>
              <div class="form-grid-3 mb-2">
                <div class="form-group">
                  <label class="form-label" for="matchVenue">Ground / Village Venue</label>
                  <input class="form-control" id="matchVenue" placeholder="e.g. Rampur Ground" />
                </div>
                <div class="form-group">
                  <label class="form-label" for="ballTypeSelect">Ball Type</label>
                  <select class="form-control" id="ballTypeSelect">
                    <option value="tennis_hard" selected>Tennis Ball (Hard)</option>
                    <option value="tennis_light">Tennis Ball (Light)</option>
                    <option value="leather">Leather Ball</option>
                    <option value="tape">Tape Ball</option>
                  </select>
                </div>
                <div class="form-group">
                  <label class="form-label" for="playersPerTeamInput">Players Per Team</label>
                  <input class="form-control" id="playersPerTeamInput" type="number" min="2" max="25" value="11" />
                </div>
              </div>

              <div class="form-grid-2 mt-2">
                <div class="form-group">
                  <label class="form-label" for="teamAPlayersText" id="teamAPlayersLabel">Host Team Players (Optional)</label>
                  <textarea class="form-control" id="teamAPlayersText" rows="2" placeholder="Player names comma separated..."></textarea>
                </div>
                <div class="form-group">
                  <label class="form-label" for="teamBPlayersText" id="teamBPlayersLabel">Visitor Team Players (Optional)</label>
                  <textarea class="form-control" id="teamBPlayersText" rows="2" placeholder="Player names comma separated..."></textarea>
                </div>
              </div>

              <div class="tabs-bar mt-2" id="ruleEngineTabs">
                <button type="button" class="tab-btn active" data-ruletab="extras">Wide / No-Ball</button>
                <button type="button" class="tab-btn" data-ruletab="boundaries">Boundaries</button>
                <button type="button" class="tab-btn" data-ruletab="wickets">Wicket Rules</button>
                <button type="button" class="tab-btn" data-ruletab="local">Local Rules</button>
              </div>

              <div id="rulePanel-extras"></div>
              <div id="rulePanel-boundaries" class="hidden"></div>
              <div id="rulePanel-wickets" class="hidden"></div>
              <div id="rulePanel-local" class="hidden"></div>
              <div id="ruleWarningsBox" class="text-sm hidden mt-1" style="color:var(--warning);font-weight:600;"></div>
            </div>
          </div>

          <!-- 5. ACTIONS ROW (PHOTO 1) -->
          <div class="cs-actions-row">
            <button type="button" class="cs-btn-advanced" id="toggleAdvancedSettingsBtn">Advanced settings</button>
            <button type="submit" class="cs-btn-start" id="startMatchSubmitBtn">Start match</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="/js/icons.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/scoring-engine.js"></script>
  <script src="/js/offline-sync.js"></script>
  <script src="/js/vendor/gsap.min.js"></script>
  <script src="/js/animations.js"></script>
  <script src="/js/main.js"></script>
  <script src="/js/cricket-ground-tools.js"></script>
  <script src="/js/match.js"></script>
</body>
</html>
