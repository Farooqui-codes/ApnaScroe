<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#208B4E" />
  <title>My Matches – ApnaScore</title>
  <meta name="description" content="View all your live, upcoming, and completed cricket matches and open scorecards on ApnaScore." />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="ApnaScore" />
  <meta property="og:title" content="My Matches – ApnaScore" />
  <meta property="og:description" content="View all your live, upcoming, and completed cricket matches and open scorecards on ApnaScore." />
  <meta property="og:image" content="/assets/images/apnascore-og-preview.jpg" />
  <meta property="og:url" content="/my-matches.html" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32.png" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="stylesheet" href="/css/fontawesome.min.css?v=15" />
  <link rel="stylesheet" href="/css/style.css?v=15" />
  <link rel="stylesheet" href="/css/responsive.css?v=15" />
  <link rel="stylesheet" href="/css/dashboard.css?v=15" />
  <link rel="stylesheet" href="/css/animations.css?v=15" />
  <style>
    body { background-color: #EEF3F0 !important; }
    .cs-container { max-width: 640px !important; margin: 0 auto !important; padding: 14px 16px 110px !important; }
    .cs-history-card {
      background: #FFFFFF !important;
      border: 1px solid #E2E8F0 !important;
      border-radius: 12px !important;
      padding: 16px !important;
      margin-bottom: 14px !important;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05) !important;
    }
    .cs-card-date { font-size: 0.85rem !important; color: #64748B !important; font-weight: 500 !important; margin-bottom: 12px !important; }
    .cs-team-score-row { display: flex !important; align-items: center !important; justify-content: space-between !important; margin-bottom: 10px !important; }
    .cs-team-left { display: flex !important; align-items: center !important; gap: 12px !important; }
    .cs-avatar-circle {
      width: 40px !important; height: 40px !important; min-width: 40px !important;
      border-radius: 50% !important; display: inline-flex !important; align-items: center !important;
      justify-content: center !important; font-weight: 700 !important; font-size: 1rem !important; color: #FFFFFF !important;
    }
    .cs-avatar-a { background: #F59E0B !important; }
    .cs-avatar-b { background: #8D6E63 !important; }
    .cs-avatar-teal { background: #0D9488 !important; }
    .cs-avatar-purple { background: #7C3AED !important; }
    .cs-avatar-blue { background: #0284C7 !important; }
    .cs-avatar-gray { background: #64748B !important; }
    .cs-team-title { font-size: 1.08rem !important; font-weight: 700 !important; color: #1E293B !important; }
    .cs-team-score-val { font-size: 1.18rem !important; font-weight: 800 !important; color: #1E293B !important; }
    .cs-team-score-val .ov-dim { font-size: 0.94rem !important; font-weight: 500 !important; color: #64748B !important; margin-left: 4px !important; }
    .cs-match-summary-text { font-size: 0.94rem !important; color: #475569 !important; margin: 10px 0 14px !important; line-height: 1.4 !important; }
    .cs-match-footer { display: flex !important; align-items: center !important; justify-content: space-between !important; padding-top: 10px !important; border-top: 1px solid #E2E8F0 !important; }
    .cs-footer-left-links { display: flex !important; align-items: center !important; gap: 20px !important; }
    .cs-footer-link { background: none !important; border: none !important; color: #1E293B !important; font-size: 0.98rem !important; font-weight: 600 !important; cursor: pointer !important; text-decoration: none !important; }
    .cs-footer-link.highlight { color: #208B4E !important; font-weight: 800 !important; }
    .cs-footer-right-icons { display: flex !important; align-items: center !important; gap: 14px !important; }
    .cs-icon-btn { background: none !important; border: none !important; color: #64748B !important; font-size: 1.1rem !important; cursor: pointer !important; padding: 6px !important; }
    .cs-icon-btn:hover { color: #208B4E !important; }
    .cs-icon-btn.delete-btn:hover { color: #DC2626 !important; }
    [data-theme="dark"] body { background-color: #0F172A !important; }
    [data-theme="dark"] .cs-history-card { background: #1E293B !important; border-color: #334155 !important; }
    [data-theme="dark"] .cs-team-title, [data-theme="dark"] .cs-team-score-val { color: #F8FAFC !important; }
    [data-theme="dark"] .cs-match-summary-text { color: #CBD5E1 !important; }
  </style>
</head>
<body>
  <div id="appShell">
    <div class="main-content-slot">
      <div class="cs-container">
        <!-- Optional Search & Filters -->
        <div class="flex-between mb-2" style="gap:8px;">
          <div class="tabs-bar" id="myMatchFilterTabs" style="margin:0;border:none;">
            <button type="button" class="tab-btn active" data-filter="all">All</button>
            <button type="button" class="tab-btn" data-filter="live">Live</button>
            <button type="button" class="tab-btn" data-filter="completed">Completed</button>
          </div>
          <input class="form-control" id="mmSearchInput" placeholder="Search..." style="max-width:180px;height:34px;font-size:0.86rem;" />
        </div>

        <select class="form-control hidden" id="mmKindFilter">
          <option value="all">All Match Types</option>
        </select>

        <div id="myMatchesGrid">
          <div class="empty-state">Loading match history...</div>
        </div>
      </div>
    </div>
  </div>

  <script src="/js/icons.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/scoring-engine.js"></script>
  <script src="/js/offline-sync.js"></script>
  <script src="/js/vendor/gsap.min.js"></script>
  <script src="/js/animations.js"></script>
  <script src="/js/main.js"></script>
  <script src="/js/my-matches.js"></script>
</body>
</html>
