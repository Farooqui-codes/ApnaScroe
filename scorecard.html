      .sidebar, .topbar, .mobile-bottom-nav, .no-print { display: none !important; }

      :root, [data-theme="dark"] {
        --bg-page: #FFFFFF;

<body>
  <div id="appShell">
    <div class="main-content-slot">
      <section id="scorecardListView">
        <div class="card mb-2">

            <h2 class="card-title">Match Scorecards & PDF Export</h2>
            <a href="/match-create.html" class="btn btn-primary btn-sm">+ New Match</a>

      <section id="scorecardDetailView" class="hidden">

            <div class="flex-gap">

              <button type="button" class="btn btn-lime btn-sm" id="sharePdfBtn">Share PDF</button>
